name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: kubeopsai/k8s-telemetry-mcp

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Lint
        run: ruff check k8s_telemetry_mcp/ tests/

      - name: Test
        run: pytest tests/ -v --tb=short

  # Builds the image on every PR so packaging breakage is caught before a release
  # tag is pushed, rather than surfacing as a failed release.
  docker-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build image (no push)
        uses: docker/build-push-action@v5
        with:
          context: .
          push: false
          load: true
          tags: k8s-telemetry-mcp:ci

      - name: Verify console script resolves
        run: docker run --rm --entrypoint python k8s-telemetry-mcp:ci -c "import k8s_telemetry_mcp.server as s; assert callable(s.main)"

  helm-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: azure/setup-helm@v4
        with:
          version: 'v3.17.3'

      - name: Lint Helm chart
        run: helm lint helm/k8s-telemetry-mcp

  publish-helm:
    needs: [test, docker-build, helm-lint]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: azure/setup-helm@v4
        with:
          version: 'v3.17.3'

      - name: Package and publish Helm chart to gh-pages
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          mkdir -p .cr-release-packages
          helm package helm/k8s-telemetry-mcp --destination .cr-release-packages

          git fetch origin gh-pages 2>/dev/null || true
          if git show-ref --verify --quiet refs/remotes/origin/gh-pages; then
            git checkout gh-pages
          else
            git checkout --orphan gh-pages
            git rm -rf . --quiet
            echo "# Helm Chart Repository" > README.md
            git add README.md
            git commit -m "init: create gh-pages branch"
          fi

          if [ -f index.yaml ]; then
            helm repo index .cr-release-packages --url https://kubeopsai.github.io/k8s-telemetry-mcp --merge index.yaml
          else
            helm repo index .cr-release-packages --url https://kubeopsai.github.io/k8s-telemetry-mcp
          fi

          cp .cr-release-packages/*.tgz .
          cp .cr-release-packages/index.yaml .
          git add *.tgz index.yaml
          git commit -m "release: helm chart ${GITHUB_REF_NAME}" || echo "Nothing to commit"
          git push origin gh-pages

  build-and-push-ghcr:
    needs: [test, docker-build, helm-lint]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Extract version from tag
        id: version
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> $GITHUB_OUTPUT

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@v3

      - name: Build and push to GHCR
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.version.outputs.VERSION }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
          labels: |
            org.opencontainers.image.version=${{ steps.version.outputs.VERSION }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=https://github.com/kubeopsai/k8s-telemetry-mcp
          cache-from: type=gha
          cache-to: type=gha,mode=max
