# K8s Telemetry MCP Server - Helm Values
# Enterprise Kubernetes Observability for LLMs

replicaCount: 1

image:
  repository: ghcr.io/kubeopsai/k8s-telemetry-mcp
  # Defaults to the chart's appVersion when left empty.
  tag: ""
  pullPolicy: IfNotPresent

imagePullSecrets: []

nameOverride: ""
fullnameOverride: ""

# Service Account with least-privilege access
serviceAccount:
  create: true
  annotations: {}
  name: ""

# Pod security context.
# uid/gid 1001 matches the `mcp` user created in the image; the chart previously
# specified 1000, which did not correspond to any user in the container.
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 1001
  runAsGroup: 1001
  fsGroup: 1001

# Container security context
securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop:
      - ALL

# MCP Server Configuration
config:
  # Loki settings (leave empty if using Datadog or CloudWatch)
  lokiUrl: ""
  lokiTimeout: 30

  # Prometheus settings (leave empty if using Datadog or CloudWatch)
  prometheusUrl: ""
  prometheusTimeout: 30

  # Tempo settings (optional)
  tempoUrl: ""
  tempoTimeout: 30

  # Datadog backend (optional — enabling it overrides Loki/Prometheus).
  #
  # Preferred: create the Secret yourself and reference it, so credentials never
  # appear in your values file or in `helm get values` output:
  #
  #   kubectl create secret generic my-datadog \
  #     --from-literal=api-key=... --from-literal=app-key=... -n monitoring
  #   --set config.datadogExistingSecret=my-datadog
  datadogExistingSecret: ""
  datadogApiKeySecretKey: "api-key"
  datadogAppKeySecretKey: "app-key"
  # Convenience path: supplying a key inline generates a Secret for you. Simpler for
  # a quick trial, but the value is then stored in the release.
  datadogApiKey: ""
  datadogAppKey: ""
  datadogSite: "datadoghq.com"  # use datadoghq.eu for EU region

  # CloudWatch backend (optional — set log group to enable, overrides Loki/Prometheus)
  cloudwatchLogGroup: ""   # e.g. /aws/containerinsights/my-cluster/application
  cloudwatchRegion: ""     # e.g. us-east-1

  # Alertmanager (optional — required for get_alertmanager_history)
  alertmanagerUrl: ""  # e.g. http://alertmanager.monitoring:9093

  # AWS region for CloudTrail, Config, ECR, RDS, ElastiCache tools
  awsRegion: "us-east-1"

  # Security settings
  enableSanitization: true
  maxLogLines: 500
  maxQueryRangeHours: 24

  # Logging
  logLevel: "INFO"

# Resource limits
resources:
  limits:
    cpu: 500m
    memory: 256Mi
  requests:
    cpu: 100m
    memory: 128Mi

# Node selector
nodeSelector: {}

# Tolerations
tolerations: []

# Affinity
affinity: {}

# RBAC — required for Kubernetes API tools:
#   get_k8s_events, get_scaling_history, get_node_pressure, get_recent_deployments
#
# When enabled, creates a ClusterRole with read-only access to:
#   events, nodes, deployments, replicasets, horizontalpodautoscalers
#
# Set to false only if you do not need the Kubernetes API tools and want
# the strictest possible least-privilege posture.
rbac:
  enabled: true

# Network Policy
networkPolicy:
  enabled: true

  # Egress to the observability stack.
  #
  # NOTE: this selector requires your observability namespace to carry the label
  # `name: monitoring`. Kubernetes does not apply that automatically. Check with
  # `kubectl get ns monitoring --show-labels` and add it if missing:
  #   kubectl label namespace monitoring name=monitoring
  # Otherwise every telemetry query will be blocked by this policy.
  egressRules:
    - to:
        - namespaceSelector:
            matchLabels:
              name: monitoring
      ports:
        - protocol: TCP
          port: 3100  # Loki
        - protocol: TCP
          port: 9090  # Prometheus
        - protocol: TCP
          port: 3200  # Tempo
        - protocol: TCP
          port: 9093  # Alertmanager

  # Namespace holding your DNS service. Scoped to kube-system by default instead of
  # matching every namespace.
  dnsNamespaceSelector:
    kubernetes.io/metadata.name: kube-system

  # The AWS-backed tools (query_cloudtrail, get_resource_history,
  # get_resource_compliance, get_image_vulnerabilities, get_database_insights) need
  # HTTPS to AWS service endpoints. Set false if you do not use them — that removes
  # the only broad egress rule in this policy.
  allowAwsApiEgress: true
  # Optional: restrict AWS egress to specific CIDRs, e.g. your VPC endpoint subnets.
  # Leaving this empty permits 443 to any destination.
  awsEndpointCidrs: []
