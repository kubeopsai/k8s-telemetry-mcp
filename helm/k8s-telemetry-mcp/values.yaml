# K8s Telemetry MCP Server - Helm Values
# Enterprise Kubernetes Observability for LLMs

replicaCount: 1

image:
  # Replace with your actual ECR URI after pushing to AWS Marketplace ECR.
  # Format: <AWS_ACCOUNT_ID>.dkr.ecr.<REGION>.amazonaws.com/k8s-telemetry-mcp
  # Example: 123456789012.dkr.ecr.us-east-1.amazonaws.com/k8s-telemetry-mcp
  repository: <AWS_ACCOUNT_ID>.dkr.ecr.<REGION>.amazonaws.com/k8s-telemetry-mcp
  tag: "1.1.1"
  pullPolicy: IfNotPresent

# Image pull secrets for AWS ECR
imagePullSecrets: []

nameOverride: ""
fullnameOverride: ""

# Service Account with least-privilege access
serviceAccount:
  create: true
  annotations: {}
  name: ""

# Pod security context
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 1000
  runAsGroup: 1000
  fsGroup: 1000

# Container security context
securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop:
      - ALL

# MCP Server Configuration
config:
  # Loki settings (leave empty if using Datadog or CloudWatch)
  lokiUrl: ""
  lokiTimeout: 30

  # Prometheus settings (leave empty if using Datadog or CloudWatch)
  prometheusUrl: ""
  prometheusTimeout: 30

  # Tempo settings (optional)
  tempoUrl: ""
  tempoTimeout: 30

  # Datadog backend (optional — set API/app keys to enable, overrides Loki/Prometheus)
  datadogApiKey: ""
  datadogAppKey: ""
  datadogSite: "datadoghq.com"  # use datadoghq.eu for EU region

  # CloudWatch backend (optional — set log group to enable, overrides Loki/Prometheus)
  cloudwatchLogGroup: ""   # e.g. /aws/containerinsights/my-cluster/application
  cloudwatchRegion: ""     # e.g. us-east-1

  # Alertmanager (optional — required for get_alertmanager_history)
  alertmanagerUrl: ""  # e.g. http://alertmanager.monitoring:9093

  # AWS region for CloudTrail, Config, ECR, RDS, ElastiCache tools
  awsRegion: "us-east-1"

  # Security settings
  enableSanitization: true
  maxLogLines: 500
  maxQueryRangeHours: 24

  # Logging
  logLevel: "INFO"

  # AWS Marketplace License
  # Set to your product code from the AWS Marketplace Management Portal.
  # Required for all production deployments — license check cannot be disabled at runtime.
  marketplaceProductCode: ""
  # Tier controls feature access. The server verifies this against your actual entitlement
  # via GetEntitlements and uses the purchased tier if they differ.
  # standard:     1 namespace, 100 log lines, 8 core tools + get_k8s_events
  # professional: unlimited namespaces, 500 log lines, all tools except Enterprise-only
  # enterprise:   unlimited namespaces, 5000 log lines, 72h range, all 23 tools
  marketplaceTier: "professional"

# Resource limits
resources:
  limits:
    cpu: 500m
    memory: 256Mi
  requests:
    cpu: 100m
    memory: 128Mi

# Node selector
nodeSelector: {}

# Tolerations
tolerations: []

# Affinity
affinity: {}

# RBAC — required for Kubernetes API tools:
#   get_k8s_events, get_scaling_history, get_node_pressure, get_recent_deployments
#
# When enabled, creates a ClusterRole with read-only access to:
#   events, nodes, deployments, replicasets, horizontalpodautoscalers
#
# Set to false only if you do not need the Kubernetes API tools and want
# the strictest possible least-privilege posture.
rbac:
  enabled: true

# Network Policy
networkPolicy:
  enabled: true
  # Allow egress only to observability stack
  egressRules:
    - to:
        - namespaceSelector:
            matchLabels:
              name: monitoring
      ports:
        - protocol: TCP
          port: 3100  # Loki
        - protocol: TCP
          port: 9090  # Prometheus
        - protocol: TCP
          port: 3200  # Tempo
