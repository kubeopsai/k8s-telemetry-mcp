# K8s Telemetry MCP Server - Helm Values
# Enterprise Kubernetes Observability for LLMs

replicaCount: 1

image:
  # Replace with your actual ECR URI after pushing to AWS Marketplace ECR.
  # Format: <AWS_ACCOUNT_ID>.dkr.ecr.<REGION>.amazonaws.com/k8s-telemetry-mcp
  # Example: 123456789012.dkr.ecr.us-east-1.amazonaws.com/k8s-telemetry-mcp
  repository: <AWS_ACCOUNT_ID>.dkr.ecr.<REGION>.amazonaws.com/k8s-telemetry-mcp
  tag: "1.0.1"
  pullPolicy: IfNotPresent

# Image pull secrets for AWS ECR
imagePullSecrets: []

nameOverride: ""
fullnameOverride: ""

# Service Account with least-privilege access
serviceAccount:
  create: true
  annotations: {}
  name: ""

# Pod security context
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 1000
  runAsGroup: 1000
  fsGroup: 1000

# Container security context
securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop:
      - ALL

# MCP Server Configuration
config:
  # Loki settings
  lokiUrl: "http://loki:3100"
  lokiTimeout: 30

  # Prometheus settings
  prometheusUrl: "http://prometheus:9090"
  prometheusTimeout: 30

  # Tempo settings
  tempoUrl: "http://tempo:3200"
  tempoTimeout: 30

  # Security settings
  enableSanitization: true
  maxLogLines: 500
  maxQueryRangeHours: 24

  # Logging
  logLevel: "INFO"

  # AWS Marketplace License
  # Set to your product code from the AWS Marketplace Management Portal.
  # Required for all production deployments — license check cannot be disabled at runtime.
  marketplaceProductCode: ""
  # Tier controls namespace access limits: standard (3 namespaces) | professional | enterprise
  marketplaceTier: "professional"

# Resource limits
resources:
  limits:
    cpu: 500m
    memory: 256Mi
  requests:
    cpu: 100m
    memory: 128Mi

# Node selector
nodeSelector: {}

# Tolerations
tolerations: []

# Affinity
affinity: {}

# Network Policy
networkPolicy:
  enabled: true
  # Allow egress only to observability stack
  egressRules:
    - to:
        - namespaceSelector:
            matchLabels:
              name: monitoring
      ports:
        - protocol: TCP
          port: 3100  # Loki
        - protocol: TCP
          port: 9090  # Prometheus
        - protocol: TCP
          port: 3200  # Tempo
