{{- /*
Generated only when Datadog credentials are supplied inline via values and no
pre-existing Secret was named. Set config.datadogExistingSecret to manage the Secret
yourself (recommended: it keeps credentials out of your values file and out of
`helm get values` output).
*/}}
{{- if and .Values.config.datadogApiKey (not .Values.config.datadogExistingSecret) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ printf "%s-datadog" (include "k8s-telemetry-mcp.fullname" .) }}
  labels:
    {{- include "k8s-telemetry-mcp.labels" . | nindent 4 }}
type: Opaque
stringData:
  api-key: {{ .Values.config.datadogApiKey | quote }}
  {{- if .Values.config.datadogAppKey }}
  app-key: {{ .Values.config.datadogAppKey | quote }}
  {{- end }}
{{- end }}
