{{- if .Values.serviceAccount.create -}}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "k8s-telemetry-mcp.serviceAccountName" . }}
  labels:
    {{- include "k8s-telemetry-mcp.labels" . | nindent 4 }}
  {{- with .Values.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
# Token is required when rbac.enabled=true so the pod can call the Kubernetes API.
# When rbac is disabled, automounting is off to follow least-privilege.
automountServiceAccountToken: {{ .Values.rbac.enabled }}
{{- end }}
