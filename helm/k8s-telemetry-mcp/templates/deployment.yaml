apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "k8s-telemetry-mcp.fullname" . }}
  labels:
    {{- include "k8s-telemetry-mcp.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "k8s-telemetry-mcp.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "k8s-telemetry-mcp.selectorLabels" . | nindent 8 }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "k8s-telemetry-mcp.serviceAccountName" . }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: {{ .Chart.Name }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          # The image entrypoint is the MCP server itself, which speaks over stdio.
          # A Deployment gives it no stdin, so it would read EOF and exit immediately
          # (CrashLoopBackOff). Assistants connect with `kubectl exec`, which starts
          # its own server process, so the pod's job is to host those sessions.
          command: ["k8s-telemetry-mcp-host"]
          env:
            - name: MCP_LOKI_URL
              value: {{ .Values.config.lokiUrl | quote }}
            - name: MCP_LOKI_TIMEOUT
              value: {{ .Values.config.lokiTimeout | quote }}
            - name: MCP_PROMETHEUS_URL
              value: {{ .Values.config.prometheusUrl | quote }}
            - name: MCP_PROMETHEUS_TIMEOUT
              value: {{ .Values.config.prometheusTimeout | quote }}
            - name: MCP_TEMPO_URL
              value: {{ .Values.config.tempoUrl | quote }}
            - name: MCP_TEMPO_TIMEOUT
              value: {{ .Values.config.tempoTimeout | quote }}
            {{- if or .Values.config.datadogApiKey .Values.config.datadogExistingSecret }}
            {{- $ddSecret := .Values.config.datadogExistingSecret | default (printf "%s-datadog" (include "k8s-telemetry-mcp.fullname" .)) }}
            # Sourced from a Secret rather than an inline value: plain env values are
            # visible in `helm get values`, the Deployment spec, and `kubectl describe`.
            - name: MCP_DATADOG_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ $ddSecret }}
                  key: {{ .Values.config.datadogApiKeySecretKey | default "api-key" }}
            - name: MCP_DATADOG_APP_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ $ddSecret }}
                  key: {{ .Values.config.datadogAppKeySecretKey | default "app-key" }}
                  optional: true
            - name: MCP_DATADOG_SITE
              value: {{ .Values.config.datadogSite | default "datadoghq.com" | quote }}
            {{- end }}
            {{- if .Values.config.cloudwatchLogGroup }}
            - name: MCP_CLOUDWATCH_LOG_GROUP
              value: {{ .Values.config.cloudwatchLogGroup | quote }}
            - name: MCP_CLOUDWATCH_REGION
              value: {{ .Values.config.cloudwatchRegion | quote }}
            {{- end }}
            - name: MCP_ENABLE_SANITIZATION
              value: {{ .Values.config.enableSanitization | quote }}
            - name: MCP_MAX_LOG_LINES
              value: {{ .Values.config.maxLogLines | quote }}
            - name: MCP_MAX_QUERY_RANGE_HOURS
              value: {{ .Values.config.maxQueryRangeHours | quote }}
            - name: MCP_LOG_LEVEL
              value: {{ .Values.config.logLevel | quote }}
            {{- if .Values.config.alertmanagerUrl }}
            - name: MCP_ALERTMANAGER_URL
              value: {{ .Values.config.alertmanagerUrl | quote }}
            {{- end }}
            - name: MCP_AWS_REGION
              value: {{ .Values.config.awsRegion | default "us-east-1" | quote }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          # Checks heartbeat freshness written by the host process. The previous probe
          # ran `importlib.util.find_spec(...)`, which only reports whether a module is
          # installed — it stayed green even with the process dead.
          livenessProbe:
            exec:
              command: ["k8s-telemetry-mcp-host", "--check"]
            initialDelaySeconds: 15
            periodSeconds: 30
            failureThreshold: 3
          readinessProbe:
            exec:
              command: ["k8s-telemetry-mcp-host", "--check"]
            initialDelaySeconds: 5
            periodSeconds: 10
            failureThreshold: 3
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
