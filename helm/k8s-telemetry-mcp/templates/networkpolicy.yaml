{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "k8s-telemetry-mcp.fullname" . }}
  labels:
    {{- include "k8s-telemetry-mcp.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "k8s-telemetry-mcp.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
    - Egress
  ingress: []  # No ingress needed - MCP uses stdio
  egress:
    {{- with .Values.networkPolicy.egressRules }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
    # Allow DNS resolution
    - to:
        - namespaceSelector: {}
      ports:
        - protocol: UDP
          port: 53
    # Allow HTTPS to AWS Marketplace Metering Service (RegisterUsage API).
    # Required for license enforcement and billing. Without this rule the
    # periodic metering calls will fail and the license check will block startup.
    # If you use a VPC endpoint for AWS Marketplace, restrict this to the
    # endpoint's private IP range instead of allowing all external HTTPS.
    - ports:
        - protocol: TCP
          port: 443
{{- end }}
