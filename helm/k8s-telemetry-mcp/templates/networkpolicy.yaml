{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "k8s-telemetry-mcp.fullname" . }}
  labels:
    {{- include "k8s-telemetry-mcp.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "k8s-telemetry-mcp.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
    - Egress
  ingress: []  # No ingress needed — assistants connect via `kubectl exec` (stdio).
  egress:
    {{- with .Values.networkPolicy.egressRules }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
    # DNS. Scoped to kube-system rather than all namespaces; override
    # networkPolicy.dnsNamespaceSelector if your cluster runs CoreDNS elsewhere.
    - to:
        - namespaceSelector:
            matchLabels:
              {{- toYaml .Values.networkPolicy.dnsNamespaceSelector | nindent 14 }}
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    {{- if .Values.networkPolicy.allowAwsApiEgress }}
    # HTTPS to AWS service endpoints, required by the AWS-backed tools:
    #   query_cloudtrail, get_resource_history, get_resource_compliance,
    #   get_image_vulnerabilities, get_database_insights
    #
    # NetworkPolicy cannot express "AWS endpoints" by name, so this permits egress to
    # 443 generally. Two ways to tighten it:
    #   * set allowAwsApiEgress: false if you do not use the AWS tools
    #   * front the AWS APIs with VPC endpoints and replace this with an ipBlock
    #     restricted to the endpoint CIDR (see networkPolicy.awsEndpointCidrs)
    {{- if .Values.networkPolicy.awsEndpointCidrs }}
    - to:
        {{- range .Values.networkPolicy.awsEndpointCidrs }}
        - ipBlock:
            cidr: {{ . | quote }}
        {{- end }}
      ports:
        - protocol: TCP
          port: 443
    {{- else }}
    - ports:
        - protocol: TCP
          port: 443
    {{- end }}
    {{- end }}
{{- end }}
